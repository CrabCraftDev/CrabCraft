[package]
name = "crab_craft"
description = "A drop-in replacement for Paper Minecraft Server written in Rust."
keywords = ["minecraft", "game-server", "crabcraft"]
authors = ["Norbiros", "goteusz-maszyk", "other CrabCraft Contributors"]
readme = "README.md"
license = "GPL-3.0-only"
version = "0.0.3"
edition = "2021"

[workspace]
members = ["tools/*", "crates/*"]

[dependencies]
bytes = "1.5.0"
chrono = "0.4.34"
log = "0.4.21"
tokio = { version = "1.36.0", features = ["full"] }
serde_json = { version = "1.0.114", features = [] }
serde = { version = "1.0.197", features = ["derive"] }
uuid = "1.7.0"
flate2 = "1.0.28"
base64 = "0.22.0"
colored = "2.1.0"
thiserror = "1.0.58"
crab_nbt = "0.0.2"
crab_protocol = { path = "crates/crab_protocol" }

[dev-dependencies]
cargo-husky = { version = "1.5.0", features = ["precommit-hook", "run-cargo-test", "run-cargo-clippy"] }
