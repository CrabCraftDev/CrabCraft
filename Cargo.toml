[package]
name = "crab_craft"
description = "A drop-in replacement for Paper Minecraft Server written in Rust."
keywords = ["minecraft", "game-server", "crabcraft"]
authors = ["Norbiros", "goteusz-maszyk", "other CrabCraft Contributors"]
readme = "README.md"
license = "AGPL-3"
version.workspace = true
edition = "2021"
rust-version = "1.83"

[workspace]
members = ["tools/*", "crates/*"]

[workspace.package]
version = "0.0.5"

[workspace.dependencies]
bytes = "1.9.0"
thiserror = "2.0.3"
uuid = { version = "1.11.0", features = ["v4"] }
tokio = { version = "1.41.1", features = ["full"] }
crab_nbt = "0.2.4"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
evenio = { git = "https://github.com/CrabCraftDev/CrabEvenio.git", rev = "8c9fc59" }
derive_more = { version = "1.0.0", features = ["into", "from"] }
strum = { version = "0.26.3", features = ["derive"] }
bitfield-struct = "0.9.2"
flate2 = { version = "1.0.35", features = ["zlib"] }

# Dev dependencies
criterion = { version = "0.5.1", features = ["html_reports"] }

# Tracing
tracing = { version = "0.1.41", features = ["attributes"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-appender = "0.2.3"

# Code generation, macros etc.
quote = "1.0.37"
syn = "2.0.90"
proc-macro2 = "1.0.92"

[dependencies]
bytes.workspace = true
thiserror.workspace = true
uuid.workspace = true
tokio.workspace = true
crab_nbt.workspace = true
serde.workspace = true
serde_json.workspace = true
evenio.workspace = true
derive_more.workspace = true
flate2.workspace = true
chrono = "0.4.38"
base64 = "0.22.1"
nu-ansi-term = "0.50.1"
supports-color = "3.0.2"
nohash-hasher = "0.2.0"
crossbeam = "0.8.4"
kanal = "0.1.0-pre8"
lazy_static = "1.5.0"
parking_lot = "0.12.3"
futures = { version = "0.3.31", default-features = false, features = ["std"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

crab_protocol = { path = "crates/crab_protocol" }
crab_registry = { path = "crates/crab_registry" }
crab_world = { path = "crates/crab_world" }
crab_macros = { path = "crates/crab_macros" }
dashmap = "6.1.0"

[dev-dependencies]
cargo-husky = { version = "1.5.0", features = [
    "precommit-hook",
    "run-for-all",
    "run-cargo-test",
    "run-cargo-check",
    "run-cargo-clippy",
    "run-cargo-fmt",
] }
