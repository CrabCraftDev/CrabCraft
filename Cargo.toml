[package]
name = "crab_craft"
description = "A drop-in replacement for Paper Minecraft Server written in Rust."
keywords = ["minecraft", "game-server", "crabcraft"]
authors = ["Norbiros", "goteusz-maszyk", "other CrabCraft Contributors"]
readme = "README.md"
license = "GPL-3.0-only"
version.workspace = true
edition = "2021"

[workspace]
members = ["tools/*", "crates/*"]

[workspace.package]
version = "0.0.4"

[workspace.dependencies]
bytes = "1.6.0"
thiserror = "1.0.58"
uuid = { version = "1.7.0", features = ["v4"] }
tokio = { version = "1.37.0", features = ["full"] }
crab_nbt = "0.1.0"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"

[dependencies]
bytes.workspace = true
thiserror.workspace = true
uuid.workspace = true
tokio.workspace = true
crab_nbt.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = "0.4.34"
log = "0.4.21"
flate2 = "1.0.28"
base64 = "0.22.0"
colored = "2.1.0"
crab_protocol = { path = "crates/crab_protocol" }
async-trait = "0.1.79"

[dev-dependencies]
cargo-husky = { version = "1.5.0", features = ["precommit-hook", "run-for-all", "run-cargo-test", "run-cargo-check", "run-cargo-clippy"] }