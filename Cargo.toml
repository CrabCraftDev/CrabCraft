[package]
name = "crab_craft"
version = "0.0.3"
edition = "2021"

[workspace]
members = ["tools/*"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytes = "1.5.0"
chrono = "0.4.31"
log = "0.4.20"
tokio = { version = "1.35.1", features = ["full"] }
serde_json = { version = "1.0.111", features = [] }
serde = { version = "1.0.195", features = ["derive"] }
uuid = "1.6.1"
flate2 = "1.0.28"
cargo-husky = { version = "1.5.0", features = ["precommit-hook", "run-cargo-test", "run-cargo-clippy"] }
