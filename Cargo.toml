[package]
name = "crab_craft"
version = "0.0.3"
edition = "2021"

[workspace]
members = ["tools/*"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytes = "1.5.0"
chrono = "0.4.34"
log = "0.4.21"
tokio = { version = "1.36.0", features = ["full"] }
serde_json = { version = "1.0.114", features = [] }
serde = { version = "1.0.197", features = ["derive"] }
uuid = "1.7.0"
flate2 = "1.0.28"
base64 = "0.22.0"
colored = "2.1.0"

[dev-dependencies]
cargo-husky = { version = "1.5.0", features = ["precommit-hook", "run-cargo-test", "run-cargo-clippy"] }
