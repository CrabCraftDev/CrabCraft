[package]
name = "crab_craft"
description = "A drop-in replacement for Paper Minecraft Server written in Rust."
keywords = ["minecraft", "game-server", "crabcraft"]
authors = ["Norbiros", "goteusz-maszyk", "other CrabCraft Contributors"]
readme = "README.md"
license = "AGPL-3"
version.workspace = true
edition = "2021"

[workspace]
members = ["tools/*", "crates/*"]

[workspace.package]
version = "0.0.4"

[workspace.dependencies]
bytes = "1.6.0"
thiserror = "1.0.61"
uuid = { version = "1.10.0", features = ["v4"] }
tokio = { version = "1.38.0", features = ["full"] }
crab_nbt = "0.1.1"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
evenio = "0.6.0"

[dependencies]
bytes.workspace = true
thiserror.workspace = true
uuid.workspace = true
tokio.workspace = true
crab_nbt.workspace = true
serde.workspace = true
serde_json.workspace = true
evenio.workspace = true
chrono = "0.4.38"
log = "0.4.22"
flate2 = "1.0.30"
base64 = "0.22.1"
colored = "2.1.0"
crab_protocol = { path = "crates/crab_protocol" }
nohash-hasher = "0.2.0"
crossbeam = "0.8.4"
kanal = "0.1.0-pre8"

[dev-dependencies]
cargo-husky = { version = "1.5.0", features = [
    "precommit-hook",
    "run-for-all",
    "run-cargo-test",
    "run-cargo-check",
    "run-cargo-clippy",
    "run-cargo-fmt",
] }
