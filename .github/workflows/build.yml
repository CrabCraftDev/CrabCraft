name: Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Make sure CI fails on all warnings, including Clippy lints
  RUSTFLAGS: "-Dwarnings"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for linux
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: crabcraft_build_${{ github.event.head_commit.id }}
          path: target/release/crab_craft
      - name: Download windows buildtools
        run: rustup target add x86_64-pc-windows-gnu
      - run: sudo apt-get install -y mingw-w64
      - name: Build for Windows
        run: cargo build --release --target x86_64-pc-windows-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: crabcraft_build_${{ github.event.head_commit.id }}.exe
          path: target/x86_64-pc-windows-gnu/release/crab_craft.exe